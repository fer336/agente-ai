    <script>
      gsap.registerPlugin(DrawSVGPlugin, MotionPathPlugin);

      const __root = document.getElementById("root");
      const __W = +__root.dataset.width, __H = +__root.dataset.height;
      const CAM_EASE = "power3.inOut";

      function camFit(tl, sel, { zoom, at = ">", dur = 1.2, pad = 1.25, ease = CAM_EASE } = {}) {
        const b = document.querySelector(sel).getBBox();
        const z = zoom ?? Math.min(__W / (b.width * pad), __H / (b.height * pad), 2.2);
        const cx = b.x + b.width / 2, cy = b.y + b.height / 2;
        return tl.to("#camera", { scale: z, x: __W / 2 - cx * z, y: __H / 2 - cy * z,
          transformOrigin: "0 0", duration: dur, ease }, at);
      }
      function camFitAll(tl, opts = {}) { return camFit(tl, "#camera", { pad: 1.06, ...opts }); }
      function camPanTo(tl, cx, cy, z, { at = ">", dur = 1.2, ease = CAM_EASE } = {}) {
        return tl.to("#camera", { scale: z, x: __W / 2 - cx * z, y: __H / 2 - cy * z,
          transformOrigin: "0 0", duration: dur, ease }, at);
      }
      function camHome(tl, { at = ">", dur = 1.1, ease = CAM_EASE } = {}) {
        return tl.to("#camera", { scale: 1, x: 0, y: 0, duration: dur, ease }, at);
      }

      const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out" } });

      // Start already fitted to the whole (oversized) scene — no cropped opening frame.
      camFitAll(tl, { at: 0, dur: 0.001 });

      /* ── Act 1 · Establish ───────────────────────────────────────── */
      tl.to("#hud-title", { opacity: 1, duration: 0.6 }, 0.1)
        .to("#hud-subtitle", { opacity: 1, duration: 0.6 }, 0.3)
        .from("#region-backend", { opacity: 0, scale: 0.97, transformOrigin: "50% 50%", duration: 0.8, ease: "power1.inOut" }, 0.4);

      /* ── Act 2 · Build (narrative / request-flow order) ─────────── */
      const buildOrder = [
        "#node-whatsapp", "#node-ycloud", "#node-webhook", "#node-ingest",
        "#node-agent", "#node-checkpointer", "#node-dentalink",
        "#node-postgres", "#node-redis", "#node-admin", "#node-incident", "#node-audio",
      ];
      tl.from(buildOrder, {
        opacity: 0, y: 22, scale: 0.92, transformOrigin: "50% 50%",
        stagger: 0.14, duration: 0.6, ease: "power2.out",
      }, 0.7);

      /* ── Act 3 · Connect (edges draw; heads pop as each lands) ──── */
      const edgeOrder = [
        "whatsapp-ycloud", "ycloud-whatsapp", "ycloud-webhook", "webhook-ingest",
        "ingest-agent", "agent-checkpointer", "checkpointer-postgres", "ingest-postgres",
        "ingest-redis", "agent-dentalink", "agent-ycloud", "agent-admin", "agent-incident", "ingest-audio",
      ];
      let et = 3.1;
      edgeOrder.forEach((name) => {
        tl.from(`#edge-${name}`, { drawSVG: "0%", duration: 0.55, ease: "power1.inOut" }, et)
          .from(`#head-${name}`, { opacity: 0, scale: 0, transformOrigin: "50% 50%", duration: 0.22, ease: "back.out(2)" }, et + 0.4);
        et += 0.19;
      });

      /* ── Act 4 · Flow / Focus (pulse-zoom across hot spots) ──────── */
      // Focus A: inbound request lands in the backend
      camFit(tl, "#region-backend", { at: 6.6, dur: 1.1, zoom: 1.35 });
      tl.set("#pulse-main", { opacity: 1 }, 6.9)
        .to("#pulse-main", { motionPath: { path: "#edge-ycloud-webhook", align: "#edge-ycloud-webhook", alignOrigin: [0.5, 0.5] }, duration: 0.8, ease: "none" }, 6.9)
        .to("#pulse-main", { motionPath: { path: "#edge-webhook-ingest", align: "#edge-webhook-ingest", alignOrigin: [0.5, 0.5] }, duration: 0.5, ease: "none" }, 7.7)
        .to("#pulse-main", { motionPath: { path: "#edge-ingest-agent", align: "#edge-ingest-agent", alignOrigin: [0.5, 0.5] }, duration: 0.5, ease: "none" }, 8.2)
        .set("#pulse-main", { opacity: 0 }, 8.75);

      // Focus B: the agent calls Dentalink
      camFit(tl, "#node-dentalink", { at: 8.9, dur: 1.0, zoom: 1.5 });
      tl.set("#pulse-dentalink", { opacity: 1 }, 9.15)
        .to("#pulse-dentalink", { motionPath: { path: "#edge-agent-dentalink", align: "#edge-agent-dentalink", alignOrigin: [0.5, 0.5] }, duration: 0.9, ease: "none" }, 9.15)
        .set("#pulse-dentalink", { opacity: 0 }, 10.1);

      // Focus C: the reply travels back out to WhatsApp
      camPanTo(tl, 880, 460, 1.15, { at: 10.3, dur: 1.0 });
      tl.set("#pulse-main", { opacity: 1 }, 10.6)
        .to("#pulse-main", { motionPath: { path: "#edge-agent-ycloud", align: "#edge-agent-ycloud", alignOrigin: [0.5, 0.5] }, duration: 1.1, ease: "none" }, 10.6)
        .to("#pulse-main", { motionPath: { path: "#edge-ycloud-whatsapp", align: "#edge-ycloud-whatsapp", alignOrigin: [0.5, 0.5] }, duration: 0.6, ease: "none" }, 11.7)
        .set("#pulse-main", { opacity: 0 }, 12.35);

      // Focus D: persistence — data layer
      camPanTo(tl, 1125, 1150, 1.3, { at: 12.5, dur: 1.0 });
      tl.set(["#pulse-persist1", "#pulse-persist2"], { opacity: 1 }, 12.8)
        .to("#pulse-persist1", { motionPath: { path: "#edge-checkpointer-postgres", align: "#edge-checkpointer-postgres", alignOrigin: [0.5, 0.5] }, duration: 0.85, ease: "none" }, 12.8)
        .to("#pulse-persist2", { motionPath: { path: "#edge-ingest-postgres", align: "#edge-ingest-postgres", alignOrigin: [0.5, 0.5] }, duration: 0.85, ease: "none" }, 12.8)
        .set(["#pulse-persist1", "#pulse-persist2"], { opacity: 0 }, 13.7)
        .set("#pulse-cache", { opacity: 1 }, 13.8)
        .to("#pulse-cache", { motionPath: { path: "#edge-ingest-redis", align: "#edge-ingest-redis", alignOrigin: [0.5, 0.5] }, duration: 0.8, ease: "none" }, 13.8)
        .set("#pulse-cache", { opacity: 0 }, 14.65);

      // Focus E: side systems briefly brighten
      camPanTo(tl, 1710, 685, 1.35, { at: 14.8, dur: 1.0 });
      tl.to(["#node-admin rect", "#node-incident rect", "#node-audio rect"], {
        filter: "url(#glow)", stagger: 0.18, duration: 0.35, yoyo: true, repeat: 1, ease: "power2.inOut",
      }, 15.1);

      /* ── Act 5 · Resolve — return home, hold ─────────────────────── */
      camFitAll(tl, { at: 16.4, dur: 1.2 });
      tl.from("#node-deploy", { opacity: 0, y: 10, duration: 0.6, ease: "power2.out" }, 17.0)
        .to({}, { duration: 1.2 });

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;

      if (!window.__hyperframes && !navigator.webdriver) {
        document.fonts.ready.then(() => tl.play());
      }
    </script>
  </body>
</html>
