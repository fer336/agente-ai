            <rect id="glow-agent" class="glow-copy" x="749" y="308" width="637" height="108" rx="16"/>
            <rect id="glow-application" class="glow-copy" x="749" y="464" width="637" height="92" rx="14"/>
            <rect id="glow-domain-appt" class="glow-copy" x="179" y="678" width="297" height="82" rx="16"/>
            <rect id="glow-infra-dentalink" class="glow-copy" x="179" y="884" width="297" height="82" rx="16"/>
            <rect id="glow-postgres" class="glow-copy" x="1454" y="274" width="422" height="160" rx="24"/>
          </g>
        </g>

        <g id="hud">
          <text id="hud-title" class="title" x="960" y="64" text-anchor="middle" opacity="0">Hexagonal Foundation</text>
          <text id="hud-subtitle" class="subtitle" x="960" y="102" text-anchor="middle" opacity="0">Python · FastAPI · LangGraph — WhatsApp dental-clinic appointment agent</text>
        </g>
      </svg>
    </div>

    <script>
      gsap.registerPlugin(DrawSVGPlugin, MotionPathPlugin);

      const __root = document.getElementById("root");
      const __W = +__root.dataset.width, __H = +__root.dataset.height;
      const CAM_EASE = "power3.inOut";
      function camFit(tl, sel, { zoom, at = ">", dur = 1.2, pad = 1.25, ease = CAM_EASE } = {}) {
        const b = document.querySelector(sel).getBBox();
        const z = zoom ?? Math.min(__W / (b.width * pad), __H / (b.height * pad), 2.2);
        const cx = b.x + b.width / 2, cy = b.y + b.height / 2;
        return tl.to("#camera", { scale: z, x: __W / 2 - cx * z, y: __H / 2 - cy * z,
          transformOrigin: "0 0", duration: dur, ease }, at);
      }
      function camFitAll(tl, opts = {}) { return camFit(tl, "#camera", { pad: 1.08, ...opts }); }
      function camHome(tl, { at = ">", dur = 1.1, ease = CAM_EASE } = {}) {
        return tl.to("#camera", { scale: 1, x: 0, y: 0, duration: dur, ease }, at);
      }

      const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out" } });

      // helper: one flash on a glow-copy element (bounded, in then out)
      function flash(sel, at, { peak = 0.85, inDur = 0.15, outDur = 0.28 } = {}) {
        tl.to(sel, { opacity: peak, duration: inDur, ease: "power2.out" }, at)
          .to(sel, { opacity: 0, duration: outDur, ease: "power2.in" }, at + inDur);
      }
      // helper: one pulse hop riding an edge (forward or reversed)
      function hop(sel, edgeSel, at, dur, reverse = false) {
        const cfg = reverse ? { start: 1, end: 0 } : { start: 0, end: 1 };
        tl.set(sel, { opacity: 1 }, at)
          .to(sel, { motionPath: { path: edgeSel, align: edgeSel, alignOrigin: [0.5, 0.5], ...cfg },
            duration: dur, ease: "none" }, at)
          .set(sel, { opacity: 0 }, at + dur);
      }

      /* ── Act 1 · Establish ───────────────────────────────────────── */
      tl.to("#hud-title", { opacity: 1, duration: 0.6 }, 0)
        .to("#hud-subtitle", { opacity: 1, duration: 0.55 }, 0.15);

      /* ── Act 2 · Build (narrative order: API → Agent → Application →
         Domain(+protocols) → Infrastructure(+fakes) → Postgres → Redis) ── */
      tl.from("#node-api", { opacity: 0, y: 22, scale: 0.92, transformOrigin: "50% 50%",
        duration: 0.5, ease: "back.out(1.4)" }, 0.75)
        .from("#node-agent", { opacity: 0, y: 22, scale: 0.92, transformOrigin: "50% 50%",
          duration: 0.5, ease: "back.out(1.4)" }, 0.90)
        .from("#node-application", { opacity: 0, y: 22, scale: 0.92, transformOrigin: "50% 50%",
          duration: 0.5, ease: "back.out(1.4)" }, 1.05)
        .from("#node-domain", { opacity: 0, y: 22, scale: 0.94, transformOrigin: "50% 50%",
          duration: 0.5, ease: "back.out(1.4)" }, 1.20)
        .from(["#node-proto-appointment", "#node-proto-messaging", "#node-proto-handoff", "#node-proto-llm"],
          { opacity: 0, y: 14, scale: 0.85, transformOrigin: "50% 50%",
            stagger: 0.07, duration: 0.4, ease: "back.out(1.4)" }, 1.45)
        .from("#node-infra", { opacity: 0, y: 22, scale: 0.94, transformOrigin: "50% 50%",
          duration: 0.5, ease: "back.out(1.4)" }, 1.90)
        .from(["#node-fake-dentalink", "#node-fake-whatsapp", "#node-fake-chatwoot", "#node-fake-llm"],
          { opacity: 0, y: 14, scale: 0.85, transformOrigin: "50% 50%",
            stagger: 0.07, duration: 0.4, ease: "back.out(1.4)" }, 2.10)
        .from("#node-postgres", { opacity: 0, y: 22, scale: 0.92, transformOrigin: "50% 50%",
          duration: 0.5, ease: "back.out(1.4)" }, 2.55)
        .from("#node-redis", { opacity: 0, y: 22, scale: 0.92, transformOrigin: "50% 50%",
          duration: 0.5, ease: "back.out(1.4)" }, 2.75);

      /* ── Act 3 · Connect (edges draw source → destination; heads pop) ── */
      tl.from("#edge-api-agent", { drawSVG: "0%", duration: 0.35, ease: "power1.inOut" }, 3.30)
        .fromTo("#head-api-agent", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, transformOrigin: "50% 50%",
          duration: 0.22, ease: "back.out(2)" }, 3.58)

        .from("#edge-agent-application", { drawSVG: "0%", duration: 0.4, ease: "power1.inOut" }, 3.65)
        .fromTo("#head-agent-application", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, transformOrigin: "50% 50%",
          duration: 0.22, ease: "back.out(2)" }, 3.98)

        .from("#edge-application-domain", { drawSVG: "0%", duration: 0.4, ease: "power1.inOut" }, 4.05)
        .fromTo("#head-application-domain", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, transformOrigin: "50% 50%",
          duration: 0.22, ease: "back.out(2)" }, 4.38)
        .from("#badge-domain-rule", { opacity: 0, scale: 0.8, transformOrigin: "50% 50%",
          duration: 0.35, ease: "back.out(1.6)" }, 4.10)

        .from("#edge-infra-domain", { drawSVG: "0%", duration: 0.4, ease: "power1.inOut" }, 4.45)
        .fromTo("#head-infra-domain", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, transformOrigin: "50% 50%",
          duration: 0.22, ease: "back.out(2)" }, 4.78)
        .from("#badge-infra-rule", { opacity: 0, scale: 0.8, transformOrigin: "50% 50%",
          duration: 0.35, ease: "back.out(1.6)" }, 4.55)

        .from("#edge-agent-postgres", { drawSVG: "0%", duration: 0.4, ease: "power1.inOut" }, 4.95)
        .fromTo("#head-agent-postgres", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, transformOrigin: "50% 50%",
          duration: 0.22, ease: "back.out(2)" }, 5.28)

        .to("#edge-infra-postgres", { opacity: 0.55, duration: 0.4, ease: "power2.out" }, 5.45)
        .to("#label-sqlalchemy-idle", { opacity: 1, duration: 0.3, ease: "power2.out" }, 5.55)
        .to("#edge-infra-redis", { opacity: 0.55, duration: 0.4, ease: "power2.out" }, 5.85);

      /* ── Act 4 · Flow (the payoff: tool → use case → gateway pattern) ── */
      tl.from("#pattern-bracket-line", { drawSVG: "0%", duration: 0.5, ease: "power1.inOut" }, 6.30)
        .to("#label-pattern-main", { opacity: 1, duration: 0.4, ease: "power2.out" }, 6.45)
        .to("#label-pattern-sub", { opacity: 1, duration: 0.4, ease: "power2.out" }, 6.55);

      // call chain: node → use case (down)
      hop("#pulse-main", "#edge-agent-application", 7.00, 0.8, false);
      flash("#glow-application", 7.75);
      // use case → protocol (down)
      hop("#pulse-main", "#edge-application-domain", 7.85, 0.75, false);
      flash("#glow-domain-appt", 8.55);
      // protocol → fake adapter (reversed traversal of the dependency edge —
      // control flow runs opposite the "implements" arrow: dependency inversion)
      hop("#pulse-main", "#edge-infra-domain", 8.65, 0.75, true);
      flash("#glow-infra-dentalink", 9.35);
      // ...results return: adapter → protocol → use case → node
      hop("#pulse-main", "#edge-infra-domain", 9.75, 0.65, false);
      flash("#glow-domain-appt", 10.35, { peak: 0.6 });
      hop("#pulse-main", "#edge-application-domain", 10.45, 0.65, true);
      flash("#glow-application", 11.05, { peak: 0.6 });
      hop("#pulse-main", "#edge-agent-application", 11.15, 0.65, true);
      flash("#glow-agent", 11.75, { peak: 0.9, outDur: 0.35 });

      // parallel: checkpointer persists conversation state after the node runs
      hop("#pulse-pg", "#edge-agent-postgres", 11.90, 0.55, false);
      flash("#glow-postgres", 12.45);
      hop("#pulse-pg", "#edge-agent-postgres", 12.50, 0.55, true);
      flash("#glow-agent", 13.05, { peak: 0.55, outDur: 0.2 });

      /* ── Act 5 · Resolve — hold the complete diagram ─────────────── */
      tl.to({}, { duration: 1.05 }, 13.35);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;

      if (!window.__hyperframes && !navigator.webdriver) {
        document.fonts.ready.then(() => tl.play());
      }
    </script>
  </body>
</html>
