<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Conversación — Admin</title>
  <link rel="stylesheet" href="/admin/static/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
</head>
<body>
  <header class="topbar">
    <nav>
      <a href="/admin/conversations" class="active">Conversaciones</a>
      <a href="/admin/errors">Errores</a>
      <a href="/admin/llm-config">Configuración LLM</a>
    </nav>
    <div class="who">
      <span id="who-label"></span>
      <button id="logout-btn">Salir</button>
    </div>
  </header>
  <main>
    <a class="back-link link" href="/admin/conversations">← Volver a conversaciones</a>
    <div id="content"><p class="muted">Cargando…</p></div>
  </main>
  <script src="/admin/static/app.js"></script>
  <script src="/admin/static/graph-view.js"></script>
  <script>
    (async () => {
      const me = await ADMIN.requireAuth();
      document.getElementById("who-label").textContent = `${me.username} · ${me.role}`;
      document.getElementById("logout-btn").addEventListener("click", ADMIN.logout);

      const pathParts = window.location.pathname.split("/").filter(Boolean);
      const conversationId = decodeURIComponent(pathParts[pathParts.length - 1]);
      const content = document.getElementById("content");

      async function loadTrace(agentRunId, graphEl, detailEl, toolsEl) {
        const response = await ADMIN.apiFetch(`/runs/${encodeURIComponent(agentRunId)}`);
        if (!response.ok) {
          graphEl.innerHTML = `<p class="muted">No se pudo cargar la traza.</p>`;
          return;
        }
        const detail = await response.json();
        await AdminGraph.render(
          graphEl,
          detail.node_executions,
          (execution) => {
            detailEl.innerHTML = AdminGraph.renderDetail(execution);
          },
          agentRunId
        );
        toolsEl.innerHTML = detail.tool_executions.length
          ? detail.tool_executions
              .map(
                (tool) => `
                  <div class="trace-step">
                    <span class="mark ${tool.status === "failed" ? "fail" : "ok"}">
                      ${tool.status === "failed" ? "✗" : "✓"}
                    </span>
                    <span>${ADMIN.escapeHtml(tool.tool_name)} · ${ADMIN.escapeHtml(tool.provider)} · ${ADMIN.escapeHtml(tool.operation)}</span>
                    <span class="muted">(${tool.duration_ms}ms)</span>
                  </div>
                `
              )
              .join("")
          : '<p class="muted">Sin tools registradas.</p>';
      }

      function loadAllTraces(detail) {
        detail.agent_runs.forEach((run) => {
          loadTrace(
            run.id,
            document.getElementById(`graph-${run.id}`),
            document.getElementById(`graph-detail-${run.id}`),
            document.getElementById(`tools-${run.id}`)
          );
        });
      }

      function renderMessage(message) {
        const direction = message.direction === "outbound" ? "outbound" : "inbound";
        return `
          <div class="message ${direction}">
            <div>${ADMIN.escapeHtml(message.text || "(sin texto)")}</div>
            <div class="meta">${direction === "outbound" ? "Agente" : "Paciente"} · ${ADMIN.formatDateTime(message.created_at)}</div>
          </div>
        `;
      }

      async function resetConversation() {
        if (!confirm("Esto borra los mensajes, la memoria y el estado del flujo de esta conversación. ¿Confirmás?")) {
          return;
        }
        const response = await ADMIN.apiFetch(`/conversations/${encodeURIComponent(conversationId)}/reset`, {
          method: "POST",
        });
        if (!response.ok) {
          alert("No se pudo reiniciar la conversación.");
          return;
        }
        window.location.reload();
      }

      // Rebuilds the whole view from a fresh fetch — used both for the
      // initial load and every polling tick, so a brand-new agent_run
      // (the next turn, which is exactly what polling exists to catch)
      // gets its own card instead of silently having nowhere to render.
      async function refreshAll() {
        const response = await ADMIN.apiFetch(`/conversations/${encodeURIComponent(conversationId)}`);
        if (!response.ok) {
          content.innerHTML = `<p class="empty-state">No se encontró la conversación.</p>`;
          return;
        }
        const detail = await response.json();
        renderContent(detail);
        loadAllTraces(detail);

        const resetBtn = document.getElementById("reset-btn");
        if (resetBtn) resetBtn.addEventListener("click", resetConversation);
      }

      function renderContent(detail) {
      const resetButton =
        me.role === "ADMIN_TECHNICAL"
          ? `<button class="danger" id="reset-btn">Reiniciar conversación</button>`
          : "";

      content.innerHTML = `
        <div class="card">
          <dl class="field-grid">
            <div><dt>ID</dt><dd>${ADMIN.escapeHtml(detail.conversation.id)}</dd></div>
            <div><dt>Estado</dt><dd><span class="badge mode-${detail.conversation.mode}">${ADMIN.escapeHtml(detail.conversation.mode)}</span></dd></div>
            <div><dt>Input</dt><dd>${ADMIN.escapeHtml(detail.conversation.input_state)}</dd></div>
            <div><dt>Creada</dt><dd>${ADMIN.formatDateTime(detail.conversation.created_at)}</dd></div>
          </dl>
          ${resetButton}
        </div>

        <h2>Mensajes</h2>
        <div class="message-list" id="message-list">
          ${detail.messages.length ? detail.messages.map(renderMessage).join("") : '<p class="muted">Sin mensajes.</p>'}
        </div>

        <h2>Agent runs</h2>
        ${detail.agent_runs.length ? "" : '<p class="muted">Sin runs registrados.</p>'}
        <p class="muted">
          El nodo "appointment" incluye varios pasos internos (elegir especialidad,
          profesional, turno) que no se registran por separado.
        </p>
        ${detail.agent_runs
          .map(
            (run) => `
              <div class="card">
                <dl class="field-grid">
                  <div><dt>Estado</dt><dd><span class="badge status-${run.status}">${ADMIN.escapeHtml(run.status)}</span></dd></div>
                  <div><dt>Modelo</dt><dd>${ADMIN.escapeHtml(run.model)}</dd></div>
                  <div><dt>Iniciado</dt><dd>${ADMIN.formatDateTime(run.started_at)}</dd></div>
                  <div><dt>Trace ID</dt><dd><a class="link" href="/admin/runs/${encodeURIComponent(run.id)}">${ADMIN.escapeHtml(run.trace_id)}</a></dd></div>
                </dl>
                <h2>Grafo del agente</h2>
                <div id="graph-${run.id}" class="graph-container"><p class="muted">Cargando…</p></div>
                <div id="graph-detail-${run.id}" class="card">
                  <p class="muted">Seleccioná un nodo ejecutado para ver el detalle.</p>
                </div>
                <h2>Tools ejecutadas</h2>
                <div id="tools-${run.id}"><p class="muted">Cargando…</p></div>
              </div>
            `
          )
          .join("")}

        <h2>Errores</h2>
        ${detail.errors.length ? "" : '<p class="muted">Sin errores.</p>'}
        ${detail.errors
          .map(
            (error) => `
              <div class="card">
                <dl class="field-grid">
                  <div><dt>Tipo</dt><dd>${ADMIN.escapeHtml(error.error_type)}</dd></div>
                  <div><dt>Severidad</dt><dd>${ADMIN.escapeHtml(error.severity)}</dd></div>
                  <div><dt>Mensaje</dt><dd>${ADMIN.escapeHtml(error.message)}</dd></div>
                  <div><dt>Detalle</dt><dd><a class="link" href="/admin/errors/${encodeURIComponent(error.id)}">Ver detalle</a></dd></div>
                </dl>
              </div>
            `
          )
          .join("")}
      `;
      }

      await refreshAll();

      // Refetches the whole conversation and re-renders it every ~10s —
      // catches a brand-new turn (agent_run) that happened since the
      // last load, not just updates to runs already on screen. There is
      // never anything new before a turn's whole trace commits at once
      // anyway (see graph-view.js's own comment on startPolling).
      AdminGraph.startPolling(refreshAll, 10000);
    })();
  </script>
</body>
</html>
