<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Conversaciones — Admin</title>
  <link rel="stylesheet" href="/admin/static/style.css" />
</head>
<body>
  <header class="topbar">
    <nav>
      <a href="/admin/conversations" class="active">Conversaciones</a>
      <a href="/admin/errors">Errores</a>
      <a href="/admin/llm-config">Configuración LLM</a>
    </nav>
    <div class="who">
      <span id="who-label"></span>
      <button id="logout-btn">Salir</button>
    </div>
  </header>
  <main>
    <h1>Conversaciones</h1>
    <div id="content"><p class="muted">Cargando…</p></div>
  </main>
  <script src="/admin/static/app.js"></script>
  <script>
    (async () => {
      const me = await ADMIN.requireAuth();
      document.getElementById("who-label").textContent = `${me.username} · ${me.role}`;
      document.getElementById("logout-btn").addEventListener("click", ADMIN.logout);

      const content = document.getElementById("content");
      const response = await ADMIN.apiFetch("/conversations");
      if (!response.ok) {
        content.innerHTML = `<p class="empty-state">No se pudo cargar la lista.</p>`;
        return;
      }
      const rows = await response.json();
      if (rows.length === 0) {
        content.innerHTML = `<p class="empty-state">Todavía no hay conversaciones.</p>`;
        return;
      }

      function resultado(row) {
        if (row.error_count > 0) return `<span class="badge status-error">⚠ Error</span>`;
        if (row.latest_run_status === "completed")
          return `<span class="badge status-completed">✓ Resuelto</span>`;
        if (row.latest_run_status === "handoff")
          return `<span class="badge status-handoff">→ Derivado</span>`;
        if (row.latest_run_status === "running")
          return `<span class="badge status-running">… En curso</span>`;
        return `<span class="muted">—</span>`;
      }

      const table = document.createElement("table");
      table.innerHTML = `
        <thead>
          <tr>
            <th>Paciente</th>
            <th>Estado</th>
            <th>Último mensaje</th>
            <th>Resultado</th>
          </tr>
        </thead>
        <tbody></tbody>
      `;
      const tbody = table.querySelector("tbody");
      rows.forEach((row) => {
        const tr = document.createElement("tr");
        tr.className = "clickable";
        tr.innerHTML = `
          <td>${ADMIN.escapeHtml(row.patient_or_identifier)}</td>
          <td><span class="badge mode-${row.mode}">${ADMIN.escapeHtml(row.mode)}</span></td>
          <td>${row.last_message_text ? ADMIN.escapeHtml(row.last_message_text) : '<span class="muted">—</span>'}
            <div class="meta muted">${ADMIN.formatDateTime(row.last_message_at)}</div>
          </td>
          <td>${resultado(row)}</td>
        `;
        tr.addEventListener("click", () => {
          window.location.href = `/admin/conversations/${encodeURIComponent(row.conversation_id)}`;
        });
        tbody.appendChild(tr);
      });
      content.innerHTML = "";
      content.appendChild(table);
    })();
  </script>
</body>
</html>
