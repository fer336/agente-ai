<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clinic AI Agent — Admin</title>
  <link rel="stylesheet" href="/admin/static/style.css" />
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="login-form" autocomplete="off">
      <h1>Panel administrativo</h1>
      <label for="username">Usuario</label>
      <input id="username" name="username" type="text" autocomplete="username" required />
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <div class="error-text" id="error-text"></div>
      <button class="primary" type="submit" id="submit-btn">Ingresar</button>
    </form>
  </div>
  <script>
    const form = document.getElementById("login-form");
    const errorText = document.getElementById("error-text");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorText.textContent = "";
      submitBtn.disabled = true;
      try {
        const response = await fetch("/admin/login", {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value,
            password: document.getElementById("password").value,
          }),
        });
        if (!response.ok) {
          errorText.textContent = "Usuario o contraseña incorrectos.";
          return;
        }
        window.location.href = "/admin/conversations";
      } catch (err) {
        errorText.textContent = "No se pudo conectar. Probá de nuevo.";
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
