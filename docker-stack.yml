version: "3.8"

# NOTE: the `agente_ai_backend_env` secret referenced below must already
# exist as a Docker Swarm secret on the target node before this stack is
# deployed:
#   docker secret create agente_ai_backend_env <path-to-local-env-file>
# This is managed out-of-band (manually) — it is NOT created or updated by
# the CI/CD workflow in .github/workflows/release.yml. Rotating it means
# creating a new secret under a new name (Swarm secrets are immutable),
# updating the `source:` below, and redeploying the stack.
#
# NOTE: the `image:` tag below is rewritten automatically by
# .github/workflows/release.yml on every release, pinned to the released
# version (e.g. v1.2.3) — do not hand-edit it, it will be overwritten.
#
# Postgres/Redis are external/managed — not part of this stack. Their real
# host/port/credentials live inside the `agente_ai_backend_env` secret file
# itself (POSTGRES_HOST, REDIS_HOST, etc.), not here.

services:
  backend:
    image: ghcr.io/fer336/agente-ai:v0.67.0
    networks:
      - network_public
    # Services on the shared Swarm overlay must use service discovery instead
    # of leaving through the node's public IP and hairpinning back through the
    # routing mesh. Credentials and all other settings still come from the
    # Swarm secret below; these non-secret endpoints only select the internal
    # data-plane route.
    environment:
      POSTGRES_HOST: postgres_postgres-vector
      REDIS_HOST: redis_redis
      # Bot role: webhooks, /public, /internal/eval, workers and migrations.
      # The admin panel runs in the separate `admin` service below. To go back
      # to the single-service layout set this to `all` (see README).
      APP_ROLE: bot
    secrets:
      - source: agente_ai_backend_env
        target: /run/secrets/backend.env
    # 9Router (LLM_API_URL) runs as a native systemd service on this same
    # Swarm manager host, bound to 0.0.0.0:20128 — but the container can't
    # reliably reach it via the host's own Tailscale IP (100.x.x.x):
    # traffic leaving a Docker bridge/overlay network addressed to one of
    # the host's own local addresses is a classic "hairpin NAT" case that
    # doesn't route back in without this. `host.docker.internal` resolves
    # to the host's real gateway IP instead, which the container CAN reach
    # normally — LLM_API_URL in the secret should point at
    # http://host.docker.internal:20128/v1, not the Tailscale IP.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_public"

        # Bot router: a plain Host() rule with no path rule and no explicit
        # priority. It does not need a path rule because the `admin` router
        # below carries Host() && PathPrefix(`/admin`) with priority=100:
        # Traefik evaluates higher priority first, so /admin/* goes to the
        # admin service and every other path (webhooks, /public, /health,
        # /ready, /internal/eval) falls through to this router. Without the
        # explicit priority Traefik orders by rule length and the longer admin
        # rule would only win by accident.
        - "traefik.http.routers.agente-ai-backend.rule=Host(`agent.qeva-ai.com`)"
        - "traefik.http.routers.agente-ai-backend.entrypoints=websecure"
        - "traefik.http.routers.agente-ai-backend.tls.certresolver=letsencryptresolver"

        - "traefik.http.services.agente-ai-backend.loadbalancer.server.port=8000"

  # Admin panel: same image as `backend`, started with APP_ROLE=admin so it
  # serves only /admin/* plus /health and /ready, starts no workers and does
  # not run migrations (the bot service owns both). Keep the `image:` line in
  # the same format as `backend`: the release pipeline pins every `image:` line
  # carrying the registry prefix, so both services move together.
  admin:
    image: ghcr.io/fer336/agente-ai:v0.67.0
    networks:
      - network_public
    environment:
      POSTGRES_HOST: postgres_postgres-vector
      REDIS_HOST: redis_redis
      APP_ROLE: admin
    secrets:
      - source: agente_ai_backend_env
        target: /run/secrets/backend.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The public /health and /ready belong to the bot (Traefik sends only
    # /admin/* here), so this service needs its own Swarm healthcheck.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_public"

        # Same host as the bot, /admin only. priority=100 is explicit so it
        # always beats the bot's Host()-only router regardless of rule length.
        - "traefik.http.routers.agente-ai-admin.rule=Host(`agent.qeva-ai.com`) && PathPrefix(`/admin`)"
        - "traefik.http.routers.agente-ai-admin.priority=100"
        - "traefik.http.routers.agente-ai-admin.entrypoints=websecure"
        - "traefik.http.routers.agente-ai-admin.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.agente-ai-admin.service=agente-ai-admin"

        - "traefik.http.services.agente-ai-admin.loadbalancer.server.port=8000"

networks:
  network_public:
    external: true
    name: network_public

secrets:
  agente_ai_backend_env:
    external: true
