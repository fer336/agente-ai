    <script>
      gsap.registerPlugin(DrawSVGPlugin, MotionPathPlugin);

      const __root = document.getElementById("root");
      const __W = +__root.dataset.width, __H = +__root.dataset.height;
      const CAM_EASE = "power3.inOut";

      function camFit(tl, sel, { zoom, at = ">", dur = 1.2, pad = 1.25, ease = CAM_EASE } = {}) {
        const b = document.querySelector(sel).getBBox();
        const z = zoom ?? Math.min(__W / (b.width * pad), __H / (b.height * pad), 2.2);
        const cx = b.x + b.width / 2, cy = b.y + b.height / 2;
        return tl.to("#camera", { scale: z, x: __W / 2 - cx * z, y: __H / 2 - cy * z,
          transformOrigin: "0 0", duration: dur, ease }, at);
      }
      function camFitAll(tl, opts = {}) { return camFit(tl, "#camera", { pad: 1.04, ...opts }); }

      const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out" } });

      /* ── Act 1 · Establish ───────────────────────────────────────── */
      tl.to("#hud-title", { opacity: 1, duration: 0.6 }, 0.1);

      /* ── Act 2 · Build ────────────────────────────────────────────
         Nodes appear in narrative order; the "safety net" halo + shield
         snaps onto each wrapped node ~0.15s after its node lands. */
      const nodeOrder = [
        "#node-start", "#node-check-mode", "#node-resolve",
        "#node-appointment", "#node-agreement", "#node-handoff", "#node-fallback",
        "#node-handle-error", "#node-end",
      ];
      tl.from(nodeOrder, {
        opacity: 0, y: 20, scale: 0.93, transformOrigin: "50% 50%",
        stagger: 0.16, duration: 0.55, ease: "power2.out",
      }, 0.7);

      const haloOrder = [
        "#halo-checkmode", "#halo-resolve",
        "#halo-appointment", "#halo-agreement", "#halo-handoff", "#halo-fallback",
      ];
      tl.from(haloOrder, {
        opacity: 0, scale: 0.9, transformOrigin: "50% 50%",
        stagger: 0.16, duration: 0.4, ease: "power2.out",
      }, 1.0);

      tl.from("#badge-llm", { opacity: 0, y: 10, duration: 0.5, ease: "power2.out" }, 2.3);

      /* ── Act 3 · Connect ─────────────────────────────────────────── */
      const edgeOrder = [
        "start-checkmode", "checkmode-resolve",
        "resolve-appointment", "resolve-agreement", "resolve-handoff", "resolve-fallback",
        "checkmode-error", "resolve-error", "appointment-error", "agreement-error", "handoff-error", "fallback-error",
        "appointment-end", "agreement-end", "handoff-end", "fallback-end",
        "checkmode-end-silent", "handleerror-end",
      ];
      let et = 3.3;
      edgeOrder.forEach((name) => {
        tl.from(`#edge-${name}`, { drawSVG: "0%", duration: 0.5, ease: "power1.inOut" }, et)
          .from(`#head-${name}`, { opacity: 0, scale: 0, transformOrigin: "50% 50%", duration: 0.2, ease: "back.out(2)" }, et + 0.36);
        et += 0.15;
      });

      /* ── Act 4 · Focus — guided tour of the happy path, then the
         error path, then the silent human-mode bypass ─────────────── */
      camFit(tl, "#node-check-mode", { at: 6.7, dur: 0.9, zoom: 1.3 });
      tl.set("#pulse-happy", { opacity: 1 }, 6.9)
        .to("#pulse-happy", { motionPath: { path: "#edge-start-checkmode", align: "#edge-start-checkmode", alignOrigin: [0.5, 0.5] }, duration: 0.5, ease: "none" }, 6.9);

      camFit(tl, "#cluster-resolve", { at: 7.7, dur: 0.9, zoom: 1.2 });
      tl.to("#pulse-happy", { motionPath: { path: "#edge-checkmode-resolve", align: "#edge-checkmode-resolve", alignOrigin: [0.5, 0.5] }, duration: 0.5, ease: "none" }, 7.9);

      tl.to("#badge-llm rect", { filter: "url(#glow)", duration: 0.4, yoyo: true, repeat: 3, ease: "power2.inOut" }, 8.5);

      camFit(tl, "#cluster-appointment", { at: 9.7, dur: 0.9, zoom: 1.25 });
      tl.to("#pulse-happy", { motionPath: { path: "#edge-resolve-appointment", align: "#edge-resolve-appointment", alignOrigin: [0.5, 0.5] }, duration: 0.6, ease: "none" }, 9.9);

      camFit(tl, "#node-end", { at: 10.9, dur: 0.9, zoom: 1.3 });
      tl.to("#pulse-happy", { motionPath: { path: "#edge-appointment-end", align: "#edge-appointment-end", alignOrigin: [0.5, 0.5] }, duration: 0.6, ease: "none" }, 11.0)
        .set("#pulse-happy", { opacity: 0 }, 11.65);

      camFit(tl, "#node-handle-error", { at: 11.85, dur: 0.9, zoom: 1.4 });
      tl.set("#pulse-error", { opacity: 1 }, 12.1)
        .to("#pulse-error", { motionPath: { path: "#edge-resolve-error", align: "#edge-resolve-error", alignOrigin: [0.5, 0.5] }, duration: 0.6, ease: "none" }, 12.1)
        .to("#pulse-error", { motionPath: { path: "#edge-handleerror-end", align: "#edge-handleerror-end", alignOrigin: [0.5, 0.5] }, duration: 0.35, ease: "none" }, 12.75)
        .set("#pulse-error", { opacity: 0 }, 13.15);

      camFitAll(tl, { at: 13.3, dur: 1.1 });
      tl.to("#edge-checkmode-end-silent", { opacity: 0.5, duration: 0.35, yoyo: true, repeat: 3, ease: "power2.inOut" }, 13.7);

      /* ── Act 5 · Resolve — hold ──────────────────────────────────── */
      tl.to({}, { duration: 1.4 });

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;

      if (!window.__hyperframes && !navigator.webdriver) {
        document.fonts.ready.then(() => tl.play());
      }
    </script>
  </body>
</html>
