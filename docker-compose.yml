services:
  app:
    # This exact `image:` line is the release pipeline's find-and-replace
    # target (`.github/workflows/release.yml`, "Pin docker-compose.yml"
    # step) — keep `ghcr.io/fer336/agente-ai:` as the only occurrence of
    # that prefix in this file, and never set this to `latest`.
    image: ghcr.io/fer336/agente-ai:v0.0.0
    env_file: .env
    environment:
      # Override the .env file's localhost defaults so the app resolves
      # its dependencies via Docker Compose service-name DNS instead.
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clinic_ai_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
