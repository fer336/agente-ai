# Scenario: "📋 Ver mi cita" shows a summary of the upcoming appointments (not a
# rescheduling flow) with Reagendar / Cancelar / Menú principal.
#
# Runs against the seeded eval patient (app/infrastructure/dentalink/eval_seed.py):
# "Lucía Prueba", DNI 39000111, with two upcoming appointments.
- description: "Ver mi cita: resumen con acciones — turn 1"
  vars:
    conversation_id: "flows-view-appointment"
    message: "📋 Ver mi cita"
    button_payload: "OPERATION_VIEW"
  assert:
    - type: javascript
      value: file://assertions/custom.js:replyKindIs
      config:
        kind: "text"
    - type: javascript
      value: file://assertions/custom.js:noListRows
  metadata:
    requires_real_llm: false

- description: "Ver mi cita: resumen con acciones — turn 2"
  vars:
    conversation_id: "flows-view-appointment"
    message: "Lucía Prueba, 39000111"
  assert:
    - type: javascript
      value: file://assertions/custom.js:hasOptionIds
      config:
        ids: ["IDENTIFICATION_CONFIRM", "IDENTIFICATION_MODIFY"]
        exact: true
    - type: javascript
      value: file://assertions/custom.js:noListRows
  metadata:
    requires_real_llm: false

- description: "Ver mi cita: resumen con acciones — turn 3"
  vars:
    conversation_id: "flows-view-appointment"
    message: "✅ Confirmar"
    button_payload: "IDENTIFICATION_CONFIRM"
  assert:
    - type: javascript
      value: file://assertions/custom.js:hasBulletLines
      config:
        min: 1
    - type: javascript
      value: file://assertions/custom.js:hasButtons
      config:
        titles: ["🔄 Reagendar", "❌ Cancelar", "Menú principal"]
        exact: true
    - type: javascript
      value: file://assertions/custom.js:noLeadingGreeting
  metadata:
    requires_real_llm: true

- description: "Ver mi cita: resumen con acciones — turn 4"
  vars:
    conversation_id: "flows-view-appointment"
    message: "Menú principal"
    button_payload: "MENU_MAIN"
  assert:
    - type: javascript
      value: file://assertions/custom.js:nodeNotVisited
      config:
        node: "handoff"
  metadata:
    requires_real_llm: false
