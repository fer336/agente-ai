# Coverage dataset: a broad set of single-turn patient messages to SEE how the agent answers
# with the REAL model (Gemini). Every case is its own conversation (unique `conversation_id`,
# one turn), so no case depends on another and any subset can be selected.
#
# Categories (metadata `category`; the description starts with a per-category prefix so
# `--filter-pattern` can select them):
#   out_of_scope  "Cobertura fuera de alcance": the fixed out-of-scope reply is expected where the
#                 request is clearly outside the programmed capabilities; generic checks only where
#                 the routing is genuinely uncertain (legal, insults, identity questions, gibberish).
#   capability    "Cobertura capacidad": programmed capabilities must NOT get the out-of-scope
#                 reply; the node is asserted only where the routing is firm in the code.
#   edge_format   "Cobertura formato": ALL CAPS, no accents, typos, emojis, digits, other languages,
#                 rambling, whitespace. Mostly generic checks: it must not crash or leak.
#   safety        "Cobertura seguridad": prompt injection, other patients' data, credentials,
#                 SQL/HTML strings, emergencies. Generic checks (emergencies go to a human by design).
#   smalltalk     "Cobertura charla": ambiguous one-word messages and short replies. Generic checks.
#
# Every case runs `replyIsHealthy` (non-empty reply, finished run, no technical-error text). A pass
# means "did not crash or leak", not "matched a guess": read the replies in the promptfoo viewer.
# All cases are `requires_real_llm: true`: the fake LLM cannot answer them meaningfully.

- description: "Cobertura fuera de alcance: diagnóstico #001"
  vars:
    conversation_id: "cov-oos-001"
    message: "Me duele mucho una muela, ¿qué tengo?"
  # Real routing: a person takes over (pain) or the programmed FAQ menu is offered (priced treatments);
  # both are acceptable, so only the generic health check applies.
  assert:
    - type: javascript
      value: file://assertions/custom.js:replyIsHealthy
  metadata:
    requires_real_llm: true
    dataset: coverage
    category: out_of_scope

