- description: "Paráfrasis de pago deriva a Administración (LLM real)"
  vars:
    conversation_id: "eval-topics-llm-03"
    message: "¿Puedo pagar en cuotas sin interés?"
  assert:
    - type: llm-rubric
      value: >
        La respuesta dice que los pagos, cuotas y demás precios se manejan directamente con
        Administración (puede ofrecer comunicarlo) y no inventa cuotas, intereses, medios de
        pago, montos ni condiciones.
  metadata:
    requires_real_llm: true

- description: "Paráfrasis de precio: blanqueamiento (LLM real)"
  vars:
    conversation_id: "eval-topics-llm-01"
    message: "¿Cuánto me sale aclararme los dientes?"
  assert:
    - type: javascript
      value: file://assertions/custom.js:nodeVisited
      config:
        node: "faq_topic"
    - type: llm-rubric
      value: >
        La respuesta informa el valor del blanqueamiento dental con la cifra del texto de la
        clínica ($450.000) sin inventar otros montos ni promociones.
  metadata:
    requires_real_llm: true

- description: "Pedido de turno que nombra un tema (LLM real)"
  vars:
    conversation_id: "eval-topics-llm-02"
    message: "Quiero un turno para limpieza"
  assert:
    - type: javascript
      value: file://assertions/custom.js:nodeNotVisited
      config:
        node: "faq_topic"
    - type: llm-rubric
      value: >
        La respuesta avanza con el pedido de turno (identificación o próximo paso de la
        reserva) y no contesta con precios ni con el texto informativo de la limpieza.
  metadata:
    requires_real_llm: true

# Consulta particular booking: "Agendar cita" on the topic answer books the "General"
# specialty (eval-spec-3): after the first-visit question and identification the patient
# sees General's slots directly, never the specialty list. Consecutive cases share one
# conversation_id.
- description: "Consulta particular: la respuesta ofrece Agendar cita con la especialidad General — turn 1"
  vars:
    conversation_id: "eval-topics-book-01"
    message: "Consulta particular"
    button_payload: "FAQ_TOPIC:consulta_particular"
  assert:
    - type: javascript
      value: file://assertions/custom.js:hasOptionIds
      config:
        ids: ["FAQ_BOOK:consulta_particular", "MENU_MAIN", "MENU_ADMIN"]
        exact: true
  metadata:
    requires_real_llm: false

- description: "Consulta particular: Agendar cita pide primero la primera visita — turn 2"
  vars:
    conversation_id: "eval-topics-book-01"
    message: "Agendar cita"
    button_payload: "FAQ_BOOK:consulta_particular"
  assert:
    - type: javascript
      value: file://assertions/custom.js:hasButtons
      config:
        titles: ["✅ Confirmar", "❌ Cancelar"]
        exact: true
  metadata:
    requires_real_llm: false

- description: "Consulta particular: paciente existente se identifica — turn 3"
  vars:
    conversation_id: "eval-topics-book-01"
    message: "❌ Cancelar"
    button_payload: "FIRST_VISIT_CANCEL"
  assert:
    - type: javascript
      value: file://assertions/custom.js:noListRows
  metadata:
    requires_real_llm: false

- description: "Consulta particular: muestra los horarios de General sin pasar por la lista de especialidades — turn 4"
  vars:
    conversation_id: "eval-topics-book-01"
    message: "Lucía Prueba, 39000111"
  assert:
    - type: javascript
      value: file://assertions/custom.js:hasOptionIds
      config:
        ids: ["SELECT_SLOT:eval-free-4", "LIST_BACK"]
        exact: true
  metadata:
    requires_real_llm: false

- description: "Consulta particular: elegir el horario propone la confirmación — turn 5"
  vars:
    conversation_id: "eval-topics-book-01"
    message: "Horario de General"
    button_payload: "SELECT_SLOT:eval-free-4"
  assert:
    - type: javascript
      value: file://assertions/custom.js:hasOptionIds
      config:
        ids: ["CONFIRM_APPOINTMENT", "REJECT_APPOINTMENT"]
        exact: true
  metadata:
    requires_real_llm: false

# Alineadores: the price image with three option buttons; choosing one starts the booking
# (first-visit question first, then straight to the "General" specialty). Consecutive cases
# share one conversation_id.
- description: "Alineadores por texto libre: imagen con Opción 1, 2 y 3 — turn 1"
  vars:
    conversation_id: "eval-topics-aligners-01"
    message: "cuánto salen los alineadores"
  assert:
    - type: javascript
      value: file://assertions/custom.js:nodeVisited
      config:
        node: "faq_topic"
    - type: javascript
      value: file://assertions/custom.js:hasButtons
      config:
        titles: ["Opción 1", "Opción 2", "Opción 3"]
        exact: true
    - type: javascript
      value: file://assertions/custom.js:hasOptionIds
      config:
        ids: ["FAQ_OPTION:alineadores:1", "FAQ_OPTION:alineadores:2", "FAQ_OPTION:alineadores:3"]
        exact: true
    - type: javascript
      value: file://assertions/custom.js:hasImage
  metadata:
    requires_real_llm: false

- description: "Alineadores: elegir la Opción 2 pide primero la primera visita — turn 2"
  vars:
    conversation_id: "eval-topics-aligners-01"
    message: "Opción 2"
    button_payload: "FAQ_OPTION:alineadores:2"
  assert:
    - type: javascript
      value: file://assertions/custom.js:hasButtons
      config:
        titles: ["✅ Confirmar", "❌ Cancelar"]
        exact: true
  metadata:
    requires_real_llm: false

- description: "Alineadores: paciente existente se identifica — turn 3"
  vars:
    conversation_id: "eval-topics-aligners-01"
    message: "❌ Cancelar"
    button_payload: "FIRST_VISIT_CANCEL"
  assert:
    - type: javascript
      value: file://assertions/custom.js:noListRows
  metadata:
    requires_real_llm: false

- description: "Alineadores: muestra los horarios de General sin la lista de especialidades — turn 4"
  vars:
    conversation_id: "eval-topics-aligners-01"
    message: "Lucía Prueba, 39000111"
  assert:
    - type: javascript
      value: file://assertions/custom.js:hasOptionIds
      config:
        ids: ["SELECT_SLOT:eval-free-4", "LIST_BACK"]
        exact: true
  metadata:
    requires_real_llm: false

- description: "Alineadores: la confirmación menciona la opción elegida — turn 5"
  vars:
    conversation_id: "eval-topics-aligners-01"
    message: "Horario de General"
    button_payload: "SELECT_SLOT:eval-free-4"
  assert:
    - type: javascript
      value: file://assertions/custom.js:mentionsAll
      config:
        terms: ["Consulta por alineadores: Opción 2"]
    - type: javascript
      value: file://assertions/custom.js:hasOptionIds
      config:
        ids: ["CONFIRM_APPOINTMENT", "REJECT_APPOINTMENT"]
        exact: true
  metadata:
    requires_real_llm: false
