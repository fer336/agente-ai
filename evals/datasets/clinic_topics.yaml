# Scenarios for the clinic's frequent topics (clinic-topics-faq): the 5 fixed-text topics
# (blanqueamiento, consulta particular, limpieza particular, brackets por obra social,
# alineadores) reached by free text and by the menu, plus the OSDE / Medifé / William Hope
# first-visit text. The fixed texts live in app/agent/clinic_topics.py and never go through
# the LLM, so `requires_real_llm: false` cases hold with the fake LLM; the
# `requires_real_llm: true` cases need the real LLM to classify a paraphrase or a booking
# phrase. Figures in the texts are pending the clinic's confirmation.

- description: "Tema frecuente por texto libre: blanqueamiento"
  vars:
    conversation_id: "eval-topics-text-01"
    message: "¿Cuánto sale el blanqueamiento?"
  assert:
    - type: javascript
      value: file://assertions/custom.js:nodeVisited
      config:
        node: "faq_topic"
    - type: javascript
      value: file://assertions/custom.js:hasButtons
      config:
        titles: ["Agendar cita", "Menú principal", "💬 Administración"]
        exact: true
    - type: javascript
      value: file://assertions/custom.js:mentionsAll
      config:
        terms: ["450.000"]
  metadata:
    requires_real_llm: false

- description: "Tema frecuente por texto libre: consulta_particular"
  vars:
    conversation_id: "eval-topics-text-02"
    message: "Quiero saber el valor de la consulta particular"
