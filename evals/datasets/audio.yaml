# PRD.md §59.5 — Audio y entradas estructuradas.
#
# `POST /internal/eval/chat` (PRD.md §61) recibe texto, no audio — estos
# casos simulan la TRANSCRIPCIÓN ya producida (lo que llegaría como
# `message` una vez que TranscribeAudioUseCase corrió), no el audio en sí.
# Lo que se evalúa acá es el comportamiento del agente ante ese texto en
# cada estado de conversación, no el pipeline de
# transcripción (cubierto por tests de infraestructura, no por Promptfoo).
# Multi-turn: the audio-specific cases run at the conversation state they describe
# (slot list, confirmation gate), reached with real button taps. The seeded eval
# patient is Lucía Prueba, DNI 39000111 (app/infrastructure/dentalink/eval_seed.py).
# `requires_real_llm: true` marks tests that grade LLM-built wording.
- description: "Audio en entrada libre aporta intención normalmente"
  vars:
    conversation_id: "eval-audio-01"
    message: "Quiero sacar un turno para la semana que viene"
  assert:
    - type: llm-rubric
      value: >
        La respuesta procesa el mensaje como cualquier entrada de texto libre —
        avanza el flujo de turnos normalmente.
  metadata:
    requires_real_llm: true

- description: "Audio durante selección interactiva no reemplaza el botón — turn 1"
  vars:
    conversation_id: "eval-audio-02"
    message: "📅 Agendar una cita"
    button_payload: "OPERATION_CREATE"
  assert:
    - type: javascript
      value: file://assertions/custom.js:hasButtons
      config:
        titles: ["✅ Confirmar", "❌ Cancelar"]
        exact: true
  metadata:
    requires_real_llm: false

- description: "Audio durante selección interactiva no reemplaza el botón — turn 2"
  vars:
    conversation_id: "eval-audio-02"
    message: "❌ Cancelar"
    button_payload: "FIRST_VISIT_CANCEL"
  assert:
    - type: javascript
      value: file://assertions/custom.js:replyKindIs
      config:
        kind: "text"
  metadata:
    requires_real_llm: false

- description: "Audio durante selección interactiva no reemplaza el botón — turn 3"
  vars:
    conversation_id: "eval-audio-02"
    message: "Lucía Prueba, 39000111"
  assert:
    - type: javascript
      value: file://assertions/custom.js:hasOptionIds
      config:
        ids: ["SPECIALTY:eval-spec-1", "SPECIALTY:eval-spec-2"]
        exact: false
  metadata:
    requires_real_llm: false

- description: "Audio durante selección interactiva no reemplaza el botón — turn 4"
  vars:
    conversation_id: "eval-audio-02"
    message: "🦷 Ortodoncia"
    button_payload: "SPECIALTY:eval-spec-1"
  assert:
    - type: javascript
      value: file://assertions/custom.js:hasOptionIds
      config:
        ids: ["SELECT_SLOT:eval-free-1", "SELECT_SLOT:eval-free-2", "LIST_BACK"]
        exact: true
  metadata:
    requires_real_llm: false

- description: "Audio durante selección interactiva no reemplaza el botón — turn 5"
  vars:
    conversation_id: "eval-audio-02"
    message: "El segundo, el de las 10"
  assert:
    - type: javascript
      value: file://assertions/custom.js:hasOptionIds
      config:
        ids: ["SELECT_SLOT:eval-free-1", "SELECT_SLOT:eval-free-2", "LIST_BACK"]
        exact: true
    - type: llm-rubric
      value: >
        La respuesta no toma la transcripción como si fuera la selección del
        botón — pide que se seleccione la opción mediante el menú interactivo
        real.
  metadata:
    requires_real_llm: true
    critical: true
    critical_reason: "PRD.md §62: confirmación mediante audio cuando se exige botón"

- description: "Audio durante confirmación sensible no confirma la acción — turn 1"
  vars:
