      value: file://assertions/custom.js:nodeVisited
      config:
        node: "handoff"
    - type: javascript
      value: file://assertions/custom.js:nodeNotVisited
      config:
        node: "appointment"
  metadata:
    requires_real_llm: false
    critical: true
    critical_reason: "PRD.md §62: fallo de handoff"

- description: "Handoff automático: me equivoqué con el turno"
  vars:
    conversation_id: "eval-audit-handoff-04"
    message: "Me equivoqué con el turno"
  assert:
    - type: javascript
      value: file://assertions/custom.js:nodeVisited
      config:
        node: "handoff"
    - type: javascript
      value: file://assertions/custom.js:nodeNotVisited
      config:
        node: "appointment"
  metadata:
    requires_real_llm: false
    critical: true
    critical_reason: "PRD.md §62: fallo de handoff"

- description: "Handoff automático: tengo un problema con mi turno"
  vars:
    conversation_id: "eval-audit-handoff-05"
    message: "Tengo un problema con mi turno"
  assert:
    - type: javascript
      value: file://assertions/custom.js:nodeVisited
      config:
        node: "handoff"
    - type: javascript
      value: file://assertions/custom.js:nodeNotVisited
      config:
        node: "appointment"
  metadata:
    requires_real_llm: false
    critical: true
    critical_reason: "PRD.md §62: fallo de handoff"

- description: "Handoff automático en pleno flujo — turn 1"
  vars:
    conversation_id: "eval-audit-handoff-06"
    message: "📅 Agendar una cita"
    button_payload: "OPERATION_CREATE"
  assert:
    - type: javascript
      value: file://assertions/custom.js:hasButtons
      config:
        titles: ["Soy paciente nuevo", "Ya soy paciente"]
        exact: true
  metadata:
    requires_real_llm: false

- description: "Handoff automático en pleno flujo — turn 2"
  vars:
    conversation_id: "eval-audit-handoff-06"
    message: "Voy a llegar tarde, avisales"
