# Scenarios for the promptfoo audit follow-ups (v0.44.0): automatic handoff phrases (PRD.md
# §22), third-party requests, patient not found, and handoff offers as buttons. Each scenario
# is a run of consecutive tests sharing one `conversation_id`; a button tap sends its id as
# `button_payload` and its title as `message`. The seeded eval patient is Lucía Prueba,
# DNI 39000111; "Juan Pérez, 30111222" is not in the eval stack. Agreements OSDE, Swiss
# Medical and Galeno are seeded (app/infrastructure/dentalink/eval_seed.py).
# Deterministic asserts (`requires_real_llm: false`) hold with the fake LLM; the rest grade
# LLM-built wording or LLM-decided offers.
# T1 — PRD.md §22: the delay and missing-appointment phrases always hand off.
- description: "Handoff automático: voy a llegar tarde"
  vars:
    conversation_id: "eval-audit-handoff-01"
    message: "Voy a llegar tarde"
  assert:
    - type: javascript
      value: file://assertions/custom.js:nodeVisited
      config:
        node: "handoff"
    - type: javascript
      value: file://assertions/custom.js:nodeNotVisited
      config:
        node: "appointment"
  metadata:
    requires_real_llm: false
    critical: true
    critical_reason: "PRD.md §62: fallo de handoff"

- description: "Handoff automático: estoy llegando"
  vars:
    conversation_id: "eval-audit-handoff-02"
    message: "Estoy llegando"
  assert:
    - type: javascript
      value: file://assertions/custom.js:nodeVisited
      config:
        node: "handoff"
    - type: javascript
      value: file://assertions/custom.js:nodeNotVisited
      config:
        node: "appointment"
  metadata:
    requires_real_llm: false
    critical: true
    critical_reason: "PRD.md §62: fallo de handoff"

- description: "Handoff automático: no aparece mi turno"
  vars:
    conversation_id: "eval-audit-handoff-03"
    message: "No aparece mi turno"
  assert:
