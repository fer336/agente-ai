# T4 — an offer to pass the patient to administración carries its buttons.
- description: "Oferta de handoff con botones: particulares y obras sociales"
  vars:
    conversation_id: "eval-audit-offer-01"
    message: "¿Trabajan con obras sociales o solo atienden particulares?"
  assert:
    - type: javascript
      value: file://assertions/custom.js:handoffOfferHasButtons
    - type: javascript
      value: file://assertions/custom.js:noLeadingGreeting
  metadata:
    requires_real_llm: true

- description: "Oferta de handoff con botones: dato sin confirmar"
  vars:
    conversation_id: "eval-audit-offer-02"
    message: "¿Cuánto sale un blanqueamiento y se puede pagar con cualquier obra social?"
  assert:
    - type: javascript
      value: file://assertions/custom.js:handoffOfferHasButtons
    - type: llm-rubric
      value: >
        La respuesta no inventa precios ni coberturas; si no tiene el dato
        confirmado, lo dice y ofrece pasar con administración.
  metadata:
    requires_real_llm: true

# T5 — the eval stack seeds OSDE, Swiss Medical and Galeno.
- description: "Convenio sembrado: osde 210 llega al nodo de convenios"
  vars:
    conversation_id: "eval-audit-agreement-01"
    message: "Tengo osde 210, me atienden?"
  assert:
    - type: javascript
      value: file://assertions/custom.js:nodeVisited
      config:
        node: "agreement"
  metadata:
    requires_real_llm: false

- description: "Convenio sembrado: Swiss Medical se reconoce por su nombre"
  vars:
    conversation_id: "eval-audit-agreement-02"
    message: "¿Atienden con Swiss Medical?"
  assert:
    - type: javascript
      value: file://assertions/custom.js:mentionsAll
      config:
        terms: ["Swiss Medical"]
    - type: llm-rubric
      value: >
        La respuesta confirma que trabajan con Swiss Medical, sin inventar
        porcentajes ni alcance de cobertura.
  metadata:
    requires_real_llm: true
