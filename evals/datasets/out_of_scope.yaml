# Scenarios for requests outside what the bot supports: the patient asks for a diagnosis, an
# unlisted price, small talk, a doctor "right now", insults, a recipe or emergency-sounding
# advice. The reply must be the FIXED approved text (`OUT_OF_SCOPE_MESSAGE` in
# app/agent/nodes/fallback.py) with exactly three buttons: Agendar una cita (OPERATION_CREATE),
# Administración (MENU_ADMIN) and Menú principal (MENU_MAIN). The in-scope controls at the end
# must NOT get that reply. Every case is deterministic (custom JS asserts, no llm-rubric) and
# holds with the fake LLM; each case is its own conversation.

- description: "Fuera de alcance: diagnóstico médico: texto fijo y 3 botones"
  vars:
    conversation_id: "eval-oos-01"
    message: "¿Me podés dar un diagnóstico? Me duele una muela hace dos días"
  assert:
    - type: javascript
      value: file://assertions/custom.js:isOutOfScopeReply
    - type: javascript
      value: file://assertions/custom.js:hasOptionIds
      config:
        ids: ["OPERATION_CREATE", "MENU_ADMIN", "MENU_MAIN"]
        exact: true
  metadata:
    requires_real_llm: false

