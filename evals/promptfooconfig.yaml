# Promptfoo config for the WhatsApp dental-clinic agent (PRD.md §58-63,
# Etapa 10 del roadmap). Evaluates the deployed agent through its own
# isolated HTTP endpoint, never a direct LLM call — matching §61's second
# evaluation level exactly:
#
#   Promptfoo → FastAPI → LangGraph → FakeDentalinkGateway → FakeYCloudGateway
#
# Running this for real needs:
#   1. `npx promptfoo eval` (Node/promptfoo CLI) — NOT part of this Python
#      project's toolchain. See evals/README.md for the full local runbook.
#   2. A running LOCAL server with `INTERNAL_EVAL_ENABLED=true` and a valid
#      admin session (`ADMIN_SESSION_COOKIE`/`ADMIN_CSRF_COOKIE` below) —
#      see app/api/routes/internal_eval.py. Never point this at production.
#   3. `EVAL_RUN_ID` (any unique string per run, e.g. `$(date +%s)`): it is
#      appended to every conversation id so a rerun never reuses the server's
#      state of an earlier run.
#
# Multi-turn: the turns of one conversation are consecutive tests that share a
# `conversation_id` var. They only work when run in order, hence
# `evaluateOptions.maxConcurrency: 1`, and cached replies would skip the server
# call that builds the conversation state, hence `cache: false`.

description: "Agente WhatsApp clínica dental — Promptfoo (PRD.md §58-63)"

prompts:
  - file://prompts/agent_system_prompt.txt

providers:
  - id: https
    label: internal-eval-chat
    config:
      url: "{{env.INTERNAL_EVAL_BASE_URL}}/internal/eval/chat"
      method: POST
      headers:
        Content-Type: application/json
        Cookie: "admin_session={{env.ADMIN_SESSION_COOKIE}}; admin_csrf={{env.ADMIN_CSRF_COOKIE}}"
        X-CSRF-Token: "{{env.ADMIN_CSRF_COOKIE}}"
      body:
        conversation_id: "{{conversation_id}}-{{ env.EVAL_RUN_ID | default('local') }}"
        message: "{{message}}"
        # Set on the turns where the real patient taps a button/list row (then
        # `message` carries the tapped title); empty means a typed message.
        button_payload: "{{ button_payload | default('') }}"
      # The provider's raw output is the full `EvalChatResponse` JSON body
      # (reply_text/agent_run_id/agent_run_status/node_names/tool_names/
      # reply_kind/buttons/list_rows/flow) —
      # left un-transformed so both `llm-rubric` (graded on the parsed
      # reply text) and the `javascript` asserts in assertions/custom.js
      # (which need node_names/tool_names, not just the reply) can inspect
      # the whole shape.
      transformResponse: "json"

evaluateOptions:
  maxConcurrency: 1
  cache: false

defaultTest:
  assert:
    - type: javascript
      value: file://assertions/custom.js:noSensitiveValuesInReply

# `file://` paths resolve from this config file's directory.
tests:
  - file://datasets/appointments.yaml
  - file://datasets/agreements.yaml
  - file://datasets/handoff.yaml
  - file://datasets/safety.yaml
  - file://datasets/adversarial.yaml
  - file://datasets/audio.yaml
  - file://datasets/flows.yaml
  - file://datasets/flows_view_appointment.yaml
