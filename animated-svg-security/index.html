      const __root = document.getElementById("root");

      function camFit(tl, sel, { zoom, at = ">", dur = 1.2, pad = 1.25, ease = CAM_EASE } = {}) {

        const z = zoom ?? Math.min(__W / (b.width * pad), __H / (b.height * pad), 2.2);

      tl.from("#edge-spine", { drawSVG: "0%", duration: 0.9, ease: "power1.inOut" }, 3.2);

      /* ── Act 4 · Focus — scroll through and confirm each guardrail ─ */
      const stops = [
        { sel: null, cx: 960, cy: 275,  check: "check-g1" },
        { sel: null, cx: 960, cy: 451,  check: "check-g2" },
        { sel: null, cx: 960, cy: 627,  check: "check-g3" },
        { sel: null, cx: 960, cy: 803,  check: "check-g4" },
        { sel: null, cx: 960, cy: 979,  check: "check-g5" },
        { sel: null, cx: 960, cy: 1155, check: "check-g6" },
        { sel: null, cx: 960, cy: 1331, check: "check-g7" },
        { sel: null, cx: 960, cy: 1507, check: "check-g8" },
        { sel: null, cx: 960, cy: 1683, check: "check-g9" },
      ];
      let ft = 4.3;
      stops.forEach((s) => {
        camPanTo(tl, s.cx, s.cy, 1.08, { at: ft, dur: 0.7 });
        tl.from(`#${s.check}`, { opacity: 0, scale: 0, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(2.4)" }, ft + 0.55)
          .to(`#${s.check}`, { opacity: 1 }, ft + 0.55);
        ft += 1.15;
      });
      // Footnote group stop
      camPanTo(tl, 960, 1850, 1.0, { at: ft, dur: 0.7 });
      tl.from(["#check-f1", "#check-f2", "#check-f3"], {
        opacity: 0, scale: 0, transformOrigin: "50% 50%", stagger: 0.12, duration: 0.3, ease: "back.out(2.4)",
      }, ft + 0.5)
        .to(["#check-f1", "#check-f2", "#check-f3"], { opacity: 1 }, ft + 0.5);
      ft += 1.5;

      /* ── Act 5 · Resolve — full checklist overview, hold ─────────── */
      camFitAll(tl, { at: ft, dur: 1.1 });
      tl.to({}, { duration: 1.3 });

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;

      if (!window.__hyperframes && !navigator.webdriver) {
        document.fonts.ready.then(() => tl.play());
      }
    </script>
